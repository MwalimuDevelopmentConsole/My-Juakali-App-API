name: Production Build & Deploy

on:
  push:
    branches: [ "production" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GITHUB }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=production
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Lowercase Image Name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            # [CHANGE 4] Use 'craftory' folder on VPS to avoid conflict with RadiantDesk
            mkdir -p ~/craftory
            cd ~/craftory
            
            # Create .env file from secret
            echo "${{ secrets.ENV_FILE }}" > .env
            
            # Create docker-compose.yml
            cat <<EOF > docker-compose.yml
            services:
              api:
                image: ghcr.io/${{ env.IMAGE_NAME }}:production
                # [CHANGE 5] Unique name for this project
                container_name: craftory-api
                restart: always
                ports:
                  # [CHANGE 6] Use port 3500 to avoid conflict with port 3500
                  - "3500:3500"
                env_file:
                  - .env
                volumes:
                  # [CHANGE 7] Map to /craftory inside the container
                  - ./uploads:/craftory/uploads
                  - ./storage:/craftory/storage
                  - ./logs:/craftory/logs
            EOF
            
            # Login to registry on the server
            echo ${{ secrets.TOKEN_GITHUB }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull and restart
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f