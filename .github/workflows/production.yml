name: Production Build & Deploy

on:
  push:
    branches: [ "production" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=production
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Lowercase Image Name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            # Navigate to app directory (create if doesn't exist)
            mkdir -p ~/app
            cd ~/app
            
            # Create .env file from secret
            echo "${{ secrets.ENV_FILE }}" > .env
            
            # Create docker-compose.yml (or update it)
            # We treat the workflow as the source of truth for the compose file content here to avoid sync issues
            cat <<EOF > docker-compose.yml
            services:
              api:
                image: ghcr.io/${{ env.IMAGE_NAME }}:production
                container_name: radient-api
                restart: always
                ports:
                  - "3500:3500"
                env_file:
                  - .env
                volumes:
                  - ./uploads:/app/uploads
                  - ./storage:/app/storage
                  - ./logs:/app/logs
            EOF
            
            # Login to registry on the server
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull and restart
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f
